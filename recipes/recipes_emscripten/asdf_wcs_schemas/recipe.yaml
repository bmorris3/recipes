context:
  version: 0.5.0
  build_number: '0'

package:
  name: asdf-wcs-schemas
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/a/asdf-wcs-schemas/asdf_wcs_schemas-${{ version }}.tar.gz
  sha256: af7bdda46c20195b97272d8d3fdc7d9286beb143dbd69503f59c5ee1fe1559b5

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
  - python >=3.9
  - setuptools>77
  - setuptools_scm>=3.4
  - wheel
  - pip
  run:
  - python >=3.9
  - asdf-standard >=1.1.0
  - asdf-transform-schemas >=0.6.0
  - asdf-coordinates-schemas >=0.4.0

tests:
- python:
    imports:
    - asdf_wcs_schemas
    pip_check: true

about:
  summary: ASDF WCS schemas
  description: |
    # asdf-wcs-schemas
    ![CI](https://github.com/asdf-format/asdf-wcs-schemas/workflows/CI/badge.svg)
    [![pre-commit](https://img.shields.io/badge/pre--commit-enabled-brightgreen?logo=pre-commit&logoColor=white)](https://github.com/pre-commit/pre-commit)
    [![Code style: black](https://img.shields.io/badge/code%20style-black-000000.svg)](https://github.com/psf/black)
    [![Imports: isort](https://img.shields.io/badge/%20imports-isort-%231674b1?style=flat&labelColor=ef8336)](https://pycqa.github.io/isort/)

    This package provides ASDF schemas for validating WCS tags. Users should not need to install this directly; instead, install an implementation package such as gwcs, which includes asdf-wcs-schemas as a dependency.
  license_file:
  - LICENSE
